name: Quiz als GitHub Pages verÃ¶ffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quiz-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: Website vorbereiten
        shell: bash
        run: |
          python3 - <<'PYBUILD'
          PWA_JS = "(() => {\n  'use strict';\n  const status = document.getElementById('offlineStatus');\n  const installButton = document.getElementById('installBtn');\n  const updateButton = document.getElementById('updateBtn');\n  let installPrompt = null;\n  let registration = null;\n  let updating = false;\n  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;\n  function setStatus(text) { status.textContent = text; }\n  function installVisibility() { installButton.hidden = standalone(); }\n  installVisibility();\n  matchMedia('(display-mode: standalone)').addEventListener('change', installVisibility);\n  window.addEventListener('beforeinstallprompt', event => {\n    event.preventDefault(); installPrompt = event; installVisibility();\n  });\n  window.addEventListener('appinstalled', () => {\n    installPrompt = null; installButton.hidden = true;\n  });\n  installButton.addEventListener('click', async () => {\n    if (installPrompt) {\n      try { await installPrompt.prompt(); await installPrompt.userChoice; }\n      catch (error) { console.warn('App-Installation:', error); }\n      installPrompt = null;\n    } else {\n      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);\n      alert(ios ? 'In Safari: Teilen â†’ Zum Home-Bildschirm â†’ HinzufÃ¼gen. Falls der Link in einer anderen App geÃ¶ffnet wurde, zuerst in Safari Ã¶ffnen.' : 'Im BrowsermenÃ¼ nach â€žApp installierenâ€œ oder â€žZum Startbildschirm hinzufÃ¼genâ€œ suchen. Nicht jeder Browser bietet eine Installation an. Das Quiz funktioniert auch ohne Installation.');\n    }\n  });\n  updateButton.addEventListener('click', () => {\n    if (!registration?.waiting) return;\n    if (document.getElementById('quizView').classList.contains('active') && !confirm('Die Aktualisierung beendet die aktuelle Runde. Jetzt aktualisieren?')) return;\n    updating = true;\n    registration.waiting.postMessage({type: 'SKIP_WAITING'});\n  });\n  if (!('serviceWorker' in navigator) || !window.isSecureContext) {\n    setStatus('Offline-Speicher benÃ¶tigt HTTPS oder localhost'); return;\n  }\n  navigator.serviceWorker.addEventListener('controllerchange', () => {\n    if (updating) location.reload();\n    else setStatus(navigator.onLine ? 'Offline bereit' : 'Offline Â· spielbereit');\n  });\n  async function networkStatus() {\n    const ready = await caches.has(window.ZEITREISE_CACHE);\n    setStatus(ready ? (navigator.onLine ? 'Offline bereit' : 'Offline Â· spielbereit') : (navigator.onLine ? 'Offline-Speicher wird vorbereitet â€¦' : 'Offline-Speicher noch nicht bereit'));\n  }\n  addEventListener('online', () => networkStatus().catch(() => setStatus('Online')));\n  addEventListener('offline', () => networkStatus().catch(() => setStatus('Offline')));\n  function watchUpdate() {\n    if (registration.waiting && navigator.serviceWorker.controller) updateButton.hidden = false;\n  }\n  navigator.serviceWorker.register('./sw.js', {scope: './', updateViaCache: 'none'})\n    .then(reg => {\n      registration = reg; watchUpdate();\n      reg.addEventListener('updatefound', () => {\n        const worker = reg.installing;\n        worker?.addEventListener('statechange', () => {\n          if (worker.state === 'installed') {\n            watchUpdate();\n            networkStatus().catch(() => {});\n          }\n        });\n      });\n      navigator.serviceWorker.ready.then(() => networkStatus()).catch(() => {});\n      networkStatus().catch(() => {});\n    })\n    .catch(error => {\n      setStatus('Offline-Speicher nicht verfÃ¼gbar'); console.warn('Service Worker:', error);\n    });\n})();\n"
          SW_JS = "'use strict';\nconst VERSION = '__VERSION__';\nconst PREFIX = 'zeitreise-' + encodeURIComponent(self.registration.scope) + '-';\nconst CACHE = PREFIX + VERSION;\nconst FILES = ['./', './index.html', './styles.css', './app.js', './questions.js', './pwa.js', './cache-version.js', './manifest.webmanifest', './icons/icon.svg', './icons/icon-192.png', './icons/icon-512.png', './icons/apple-touch-icon.png'];\nconst URLS = new Set(FILES.map(path => new URL(path, self.registration.scope).href));\nself.addEventListener('install', event => {\n  event.waitUntil(caches.open(CACHE).then(cache => cache.addAll(FILES.map(path => new Request(new URL(path, self.registration.scope), {cache: 'reload'})))));\n});\nself.addEventListener('activate', event => {\n  event.waitUntil((async () => {\n    for (const name of await caches.keys()) {\n      if (name.startsWith(PREFIX) && name !== CACHE) await caches.delete(name);\n    }\n    await self.clients.claim();\n  })());\n});\nself.addEventListener('message', event => {\n  if (event.data?.type === 'SKIP_WAITING') self.skipWaiting();\n});\nself.addEventListener('fetch', event => {\n  if (event.request.method !== 'GET') return;\n  const url = new URL(event.request.url);\n  url.search = ''; url.hash = '';\n  if (!URLS.has(url.href)) return;\n  event.respondWith((async () => {\n    const cache = await caches.open(CACHE);\n    return (await cache.match(url.href)) || fetch(event.request);\n  })());\n});\n"
          ADDITIONS_CSS = '/* PWA, Bedienbarkeit und Korrekturen gegenÃ¼ber dem Original */\n[hidden]{display:none!important}\n.pwa-bar{max-width:1100px;margin:18px auto -28px;padding:0 28px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:11px;color:#52625b}\n.pwa-bar span{margin-right:auto}\n.pwa-bar button{border:1px solid #14282333;background:#fffaf0;border-radius:999px;padding:8px 12px;font:700 11px system-ui;cursor:pointer;color:#142823}\nbutton:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #1d8580;outline-offset:4px}\n.choice input:focus-visible+label{outline:3px solid #1d8580;outline-offset:3px}\nbutton:disabled{opacity:.6;cursor:not-allowed}\n#difficultyOptions{grid-template-columns:repeat(4,1fr)}\n@media(max-width:720px){.pwa-bar{padding:0 18px;margin-bottom:-16px}#difficultyOptions{grid-template-columns:1fr 1fr}}\n'
          import pathlib, shutil, tarfile, json, hashlib, struct, zlib
          root = pathlib.Path('.')
          out = root / '_site'
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          source = root / 'site'
          if source.is_dir():
              shutil.copytree(source, out, dirs_exist_ok=True)
              print('Verwende fertige Website aus site/.')
          else:
              archive = root / '6751629b.tar'
              if not archive.is_file():
                  raise SystemExit('6751629b.tar fehlt. Originalarchiv im Repository belassen oder site/ aus dem Komplettpaket hochladen.')
              with tarfile.open(archive, 'r:*') as tar:
                  for filename in ['index.html', 'styles.css', 'app.js', 'questions.js']:
                      member = tar.getmember('zeitreise-quiz/app/' + filename)
                      if not member.isfile() or member.size > 2_000_000: raise SystemExit('UngÃ¼ltiger Archiveintrag')
                      (out / filename).write_bytes(tar.extractfile(member).read())
              html = (out / 'index.html').read_text()
              html = html.replace('<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="./styles.css">\n  <link rel="manifest" href="./manifest.webmanifest">\n  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">\n  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-title" content="Zeitreise">')
              html = html.replace('  <main id="app"', '  <aside class="pwa-bar" aria-label="App und Offline-Status"><span id="offlineStatus" role="status">Offline-Speicher wird vorbereitet â€¦</span><button id="installBtn" type="button">Als App installieren</button><button id="updateBtn" type="button" hidden>Update laden</button></aside>\n  <main id="app"')
              html = html.replace('  <script src="app.js"></script>', '  <script src="app.js"></script>\n  <script src="./cache-version.js"></script>\n  <script src="./pwa.js"></script>')
              (out / 'index.html').write_text(html)
              app = (out / 'app.js').read_text()
              app = app.replace('function answer(value){\n', 'function answer(value){\n    if(state.answers.length>state.pos)return;\n')
              app = app.replace('function next(){if(state.answers.length<=state.pos)return;', 'function next(){if(state.pos>=state.round.length||state.answers.length<=state.pos)return;')
              start = app.index('  function loadStats()')
              end = app.index('  function showStats()', start)
              app = app[:start] + '''  let memoryStats={rounds:0,questions:0,correct:0};
            function loadStats(){try{const s=JSON.parse(localStorage.getItem('zeitreiseStats'));if(s&&['rounds','questions','correct'].every(k=>Number.isSafeInteger(s[k])&&s[k]>=0)&&s.correct<=s.questions){memoryStats=s}}catch{}return {...memoryStats}}
            function saveStats(correct,total){const s=loadStats();s.rounds++;s.questions+=total;s.correct+=correct;memoryStats=s;try{localStorage.setItem('zeitreiseStats',JSON.stringify(s))}catch{toast('Statistik nur fÃ¼r diese Sitzung verfÃ¼gbar')}}
          ''' + app[end:]
              app = app.replace("$('#statsDialog').showModal()", "if(!$('#statsDialog').open)$('#statsDialog').showModal()")
              app = app.replace("localStorage.removeItem('zeitreiseStats');showStats();", "memoryStats={rounds:0,questions:0,correct:0};try{localStorage.removeItem('zeitreiseStats')}catch{}showStats();")
              app = app.replace("  if(Q.length!==240)", "  $('.brand').addEventListener('click',e=>{e.preventDefault();if(!views.quiz.classList.contains('active')||confirm('Aktuelle Runde beenden?'))show('home')});\n  if(Q.length!==240)")
              (out / 'app.js').write_text(app)
              with (out / 'styles.css').open('a') as f: f.write('\n' + ADDITIONS_CSS)
              (out / 'pwa.js').write_text(PWA_JS)
              icons = out / 'icons'
              icons.mkdir()
              glyphs = {'Z':['11111','00001','00010','00100','01000','10000','11111'],'R':['11110','10001','10001','11110','10100','10010','10001']}
              def png(size):
                  def chunk(name, data): return struct.pack('!I', len(data))+name+data+struct.pack('!I', zlib.crc32(name+data)&0xffffffff)
                  rows=[]
                  for y in range(size):
                      row=bytearray()
                      for x in range(size):
                          ux,uy=x/size,y/size
                          color=(20,40,35)
                          if .12<=ux<.88 and .12<=uy<.88:
                              color=(237,107,53) if uy<.4 else ((245,187,67) if uy<.6 else (29,133,128))
                          gx=int((ux-.225)/.05);gy=int((uy-.325)/.05)
                          if 0<=gy<7:
                              if 0<=gx<5 and glyphs['Z'][gy][gx]=='1': color=(255,250,240)
                              if 6<=gx<11 and glyphs['R'][gy][gx-6]=='1': color=(255,250,240)
                          row.extend(color)
                      rows.append(b'\x00'+row)
                  return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!IIBBBBB',size,size,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b'')
              for size,filename in [(192,'icon-192.png'),(512,'icon-512.png'),(180,'apple-touch-icon.png')]: (icons/filename).write_bytes(png(size))
              (icons/'icon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#142823"/><path d="M62 62h388v143H62z" fill="#ed6b35"/><path d="M62 205h388v102H62z" fill="#f5bb43"/><path d="M62 307h388v143H62z" fill="#1d8580"/><text x="256" y="329" text-anchor="middle" fill="#fffaf0" font-family="sans-serif" font-weight="900" font-size="206">ZR</text></svg>')
              manifest = {'id':'./','name':'Zeitreise â€“ Das 70er & 80er Quiz','short_name':'Zeitreise','description':'Das nostalgische Quiz mit 240 Fragevarianten aus den 70ern und 80ern.','lang':'de','start_url':'./','scope':'./','display':'standalone','theme_color':'#f4b942','background_color':'#f4eddf','icons':[{'src':'./icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},{'src':'./icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}]}
              (out/'manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
              (out/'.nojekyll').touch()
              version=hashlib.sha256(''.join(p.name+hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file()).encode()).hexdigest()[:16]
              prefix='zeitreise-https%3A%2F%2Fcommanderf.github.io%2Fquizfragen%2F-'
              (out/'cache-version.js').write_text("window.ZEITREISE_CACHE = 'zeitreise-' + encodeURIComponent(new URL('./', document.baseURI).href) + '-"+version+"';\n")
              (out/'sw.js').write_text(SW_JS.replace('__VERSION__', version))
              print('Originalarchiv zu GitHub-Pages/PWA aufgebaut, Version:',version)
          print('Website-Dateien:',len([p for p in out.rglob('*') if p.is_file()]))
          PYBUILD
      - name: JavaScript prÃ¼fen
        shell: bash
        run: |
          node --check _site/app.js
          node --check _site/questions.js
          node --check _site/pwa.js
          node --check _site/sw.js
          node --check _site/cache-version.js
